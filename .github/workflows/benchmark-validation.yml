name: Benchmark Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: collect (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3 machines spanning 2 OS/arch combos (arm64 + x64).
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bench:validate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-${{ matrix.os }}
          path: benchmark-validation-report.json

  aggregate:
    name: aggregate
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the updated history + validation doc back
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: reports

      # Records run history + regenerates docs/benchmarks/validation.md, then
      # exits 1 if ≥2 machines fail the same benchmark (warn-only on a single
      # machine). continue-on-error lets the commit run before the gate.
      - id: aggregate
        continue-on-error: true
        run: pnpm bench:validate:aggregate reports --record

      - name: Commit validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/history.json docs/benchmarks/validation.md
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "chore(benchmarks): update validation results [skip ci]"
            git push
          fi

      - name: Gate on validation outcome
        if: steps.aggregate.outcome == 'failure'
        run: |
          echo "::error::benchmark validation failed (≥2 machines breached the threshold)"
          exit 1
